name: Insta diagnose (real Instagram)

# 실제 인스타 응답과 수집 결과를 로그 · 엑셀로 확인하는 점검용 워크플로.
# Actions 탭에서 수동 실행하거나, claude/* 브랜치에서 계정 목록 · 이 파일을 바꿔 올리면 실행된다.
# GitHub 서버(데이터센터) IP 는 인스타가 비로그인 요청을 더 빨리 막을 수 있다.
on:
  workflow_dispatch:
    inputs:
      accounts:
        description: "아이디 또는 링크 (공백으로 구분). 비우면 tools/insta_accounts.txt"
        required: false
        default: ""
  push:
    branches: ["claude/**"]
    paths:
      - "tools/insta_accounts.txt"
      - "tools/insta_diagnose.py"
      - ".github/workflows/insta-diagnose.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Diagnose
        env:
          INSTA_CRAWLER_HOME: ${{ runner.temp }}/ic-home
          ACCOUNTS: ${{ inputs.accounts }}
        run: python tools/insta_diagnose.py $ACCOUNTS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insta-excel
          path: ${{ runner.temp }}/ic-home/out
          if-no-files-found: ignore
